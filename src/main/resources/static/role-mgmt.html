<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>角色权限管理</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background: #f0f2f5;
            padding: 25px;
            height: 100vh;
            overflow-y: auto;
        }
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .page-header h2 { color: #333; font-size: 22px; }
        .btn {
            padding: 8px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: opacity 0.2s;
        }
        .btn:hover { opacity: 0.85; }
        .btn-primary { background: #667eea; color: white; }
        .btn-danger { background: #e74c3c; color: white; }
        .btn-success { background: #27ae60; color: white; }
        .btn-sm { padding: 4px 12px; font-size: 13px; margin: 0 3px; }
        .role-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
        }
        .role-card {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            transition: box-shadow 0.2s;
        }
        .role-card:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.1); }
        .role-card h4 {
            color: #333;
            font-size: 17px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .role-code { color: #999; font-size: 12px; background: #f5f5f5; padding: 2px 8px; border-radius: 4px; }
        .role-desc { color: #777; font-size: 13px; margin-bottom: 12px; }
        .menu-checkboxes {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 14px;
        }
        .menu-check {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 13px;
            color: #555;
            background: #f8f9fa;
            padding: 4px 10px;
            border-radius: 4px;
            cursor: pointer;
        }
        .menu-check:hover { background: #eef0ff; }
        .card-actions { display: flex; gap: 8px; }
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 2000;
            align-items: center;
            justify-content: center;
        }
        .modal-overlay.show { display: flex; }
        .modal {
            background: white;
            border-radius: 12px;
            padding: 30px;
            width: 420px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.2);
        }
        .modal h3 { margin-bottom: 20px; color: #333; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; margin-bottom: 5px; color: #555; font-size: 14px; font-weight: 500; }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 9px 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            font-family: inherit;
        }
        .form-group input:focus, .form-group textarea:focus { border-color: #667eea; }
        .form-group textarea { height: 60px; resize: vertical; }
        .form-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }
        .btn-cancel { background: #eee; color: #333; }
        .toast {
            position: fixed;
            top: 20px; right: 20px;
            padding: 12px 24px;
            border-radius: 8px;
            color: white;
            font-size: 14px;
            z-index: 3000;
            display: none;
            animation: slideIn 0.3s ease;
        }
        @keyframes slideIn { from { transform: translateX(100px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        .toast-success { background: #27ae60; }
        .toast-error { background: #e74c3c; }
    </style>
</head>
<body>

    <div class="page-header">
        <h2>🔐 角色权限管理</h2>
        <button class="btn btn-primary" onclick="openCreateModal()">+ 新增角色</button>
    </div>

    <div class="role-grid" id="roleGrid"></div>

    <!-- 新增/编辑弹窗 -->
    <div class="modal-overlay" id="roleModal">
        <div class="modal">
            <h3 id="modalTitle">新增角色</h3>
            <form id="roleForm">
                <input type="hidden" id="editId">
                <div class="form-group">
                    <label>角色名称 *</label>
                    <input type="text" id="editName" required>
                </div>
                <div class="form-group">
                    <label>角色编码 *</label>
                    <input type="text" id="editCode" required placeholder="如 ROLE_XXX">
                </div>
                <div class="form-group">
                    <label>描述</label>
                    <textarea id="editDesc"></textarea>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn btn-cancel" onclick="closeModal()">取消</button>
                    <button type="submit" class="btn btn-primary">保存</button>
                </div>
            </form>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        let allRoles = [];
        let allMenus = [];
        let roleMenus = {}; // roleId -> [menuId, ...]

        async function init() {
            // 加载菜单列表
            const menuResp = await fetch('/api/menus');
            const menuData = await menuResp.json();
            allMenus = menuData.data || [];

            // 加载角色列表
            await loadRoles();
        }

        async function loadRoles() {
            const resp = await fetch('/api/roles');
            const data = await resp.json();
            if (!data.success) { showToast('加载失败: ' + (data.message||'无权限'), 'error'); return; }
            allRoles = data.data || [];

            // 加载每个角色的菜单
            for (const role of allRoles) {
                const rResp = await fetch('/api/roles/' + role.id);
                const rData = await rResp.json();
                if (rData.success) {
                    roleMenus[role.id] = rData.menuIds || [];
                }
            }
            renderRoles();
        }

        function renderRoles() {
            const grid = document.getElementById('roleGrid');
            grid.innerHTML = allRoles.map(role => {
                const assignedMenuIds = roleMenus[role.id] || [];
                const menuChecks = allMenus.map(m => {
                    const checked = assignedMenuIds.includes(m.id);
                    return `<label class="menu-check">
                        <input type="checkbox" value="${m.id}" ${checked?'checked':''} onchange="saveMenus(${role.id})">
                        ${m.icon||''} ${m.menuName}
                    </label>`;
                }).join('');

                return `<div class="role-card">
                    <h4>🔑 ${role.roleName} <span class="role-code">${role.roleCode}</span></h4>
                    <p class="role-desc">${role.description||'无描述'}</p>
                    <div style="font-size:12px;color:#888;margin-bottom:8px">📋 可访问菜单：</div>
                    <div class="menu-checkboxes">${menuChecks}</div>
                    <div class="card-actions">
                        <button class="btn btn-primary btn-sm" onclick="openEditModal(${role.id})">编辑</button>
                        <button class="btn btn-danger btn-sm" onclick="deleteRole(${role.id})">删除</button>
                    </div>
                </div>`;
            }).join('');
        }

        async function saveMenus(roleId) {
            const card = document.querySelectorAll('.role-card')[allRoles.findIndex(r => r.id === roleId)];
            const checks = card ? card.querySelectorAll('input[type=checkbox]:checked') : [];
            const menuIds = Array.from(checks).map(c => parseInt(c.value));

            const resp = await fetch('/api/roles/' + roleId + '/menus', {
                method: 'POST',
                headers: {'Content-Type':'application/json'},
                body: JSON.stringify({menuIds})
            });
            const data = await resp.json();
            roleMenus[roleId] = menuIds;
            showToast(data.message, data.success?'success':'error');
        }

        function openCreateModal() {
            document.getElementById('editId').value = '';
            document.getElementById('modalTitle').textContent = '新增角色';
            document.getElementById('editName').value = '';
            document.getElementById('editCode').value = '';
            document.getElementById('editDesc').value = '';
            document.getElementById('roleModal').classList.add('show');
        }

        async function openEditModal(id) {
            const role = allRoles.find(r => r.id === id);
            if (!role) return;
            document.getElementById('editId').value = role.id;
            document.getElementById('modalTitle').textContent = '编辑角色';
            document.getElementById('editName').value = role.roleName;
            document.getElementById('editCode').value = role.roleCode;
            document.getElementById('editDesc').value = role.description||'';
            document.getElementById('roleModal').classList.add('show');
        }

        function closeModal() {
            document.getElementById('roleModal').classList.remove('show');
        }

        document.getElementById('roleForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const id = document.getElementById('editId').value;
            const body = {
                roleName: document.getElementById('editName').value.trim(),
                roleCode: document.getElementById('editCode').value.trim(),
                description: document.getElementById('editDesc').value.trim()
            };
            const url = id ? '/api/roles/' + id : '/api/roles';
            const method = id ? 'PUT' : 'POST';
            const resp = await fetch(url, {
                method: method,
                headers: {'Content-Type':'application/json'},
                body: JSON.stringify(body)
            });
            const data = await resp.json();
            showToast(data.message||(data.success?'操作成功':'操作失败'), data.success?'success':'error');
            if (data.success) { closeModal(); loadRoles(); }
        });

        async function deleteRole(id) {
            if (id == 1) { showToast('不能删除超级管理员角色','error'); return; }
            if (!confirm('确认删除该角色？关联用户的权限将失效。')) return;
            const resp = await fetch('/api/roles/' + id, { method: 'DELETE' });
            const data = await resp.json();
            showToast(data.message, data.success?'success':'error');
            if (data.success) loadRoles();
        }

        function showToast(msg, type) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.className = 'toast toast-' + type;
            toast.style.display = 'block';
            setTimeout(() => { toast.style.display = 'none'; }, 3000);
        }

        init();
    </script>
</body>
</html>
