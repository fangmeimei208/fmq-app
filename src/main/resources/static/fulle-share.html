<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>富勒股权穿透</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Microsoft YaHei', 'Segoe UI', Tahoma, sans-serif;
            background: #f5f7fa;
            color: #333;
            padding: 24px;
            overflow-y: auto;
            height: 100vh;
        }
        .page-header {
            display: flex; align-items: center; gap: 12px; margin-bottom: 20px;
        }
        .page-header h2 { font-size: 22px; color: #1a1a2e; }

        .stats-row {
            display: flex; gap: 16px; margin-bottom: 20px; flex-wrap: wrap;
        }
        .stat-card {
            background: white; border-radius: 10px; padding: 16px 24px;
            box-shadow: 0 1px 6px rgba(0,0,0,0.06); min-width: 160px; flex: 1;
        }
        .stat-card .label { font-size: 13px; color: #999; margin-bottom: 6px; }
        .stat-card .value { font-size: 28px; font-weight: bold; color: #667eea; }

        .search-bar {
            background: white; border-radius: 10px; padding: 20px 24px;
            box-shadow: 0 1px 6px rgba(0,0,0,0.06); margin-bottom: 20px;
            display: flex; gap: 16px; align-items: flex-end; flex-wrap: wrap;
        }
        .search-group { display: flex; flex-direction: column; gap: 6px; }
        .search-group label { font-size: 13px; color: #666; font-weight: 500; }
        .search-group input, .search-group select {
            padding: 8px 14px; border: 1px solid #d9d9d9; border-radius: 6px;
            font-size: 14px; outline: none; min-width: 160px;
        }
        .search-group input:focus, .search-group select:focus {
            border-color: #667eea; box-shadow: 0 0 0 2px rgba(102,126,234,0.15);
        }
        .btn {
            padding: 8px 20px; border: none; border-radius: 6px; font-size: 14px;
            cursor: pointer; transition: all 0.2s; font-weight: 500;
        }
        .btn-primary { background: #667eea; color: white; }
        .btn-primary:hover { background: #5a6fd6; }
        .btn-outline { background: white; color: #667eea; border: 1px solid #667eea; }
        .btn-outline:hover { background: #f0f2ff; }

        .table-container {
            background: white; border-radius: 10px;
            box-shadow: 0 1px 6px rgba(0,0,0,0.06); overflow: auto;
            max-height: calc(100vh - 380px);
        }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        thead { position: sticky; top: 0; z-index: 10; }
        th {
            background: #f8f9fc; padding: 12px 14px; text-align: left;
            border-bottom: 2px solid #e8e8e8; font-weight: 600; color: #555;
            white-space: nowrap;
        }
        td { padding: 10px 14px; border-bottom: 1px solid #f0f0f0; }
        tr:hover { background: #fafbff; }
        .ratio-bar {
            display: inline-block; height: 6px; border-radius: 3px;
            background: linear-gradient(90deg, #667eea, #764ba2);
            margin-right: 6px; vertical-align: middle;
        }
        .highlight { color: #764ba2; font-weight: 600; }
        .path-chain {
            font-size: 12px; color: #888; max-width: 500px; word-break: break-all;
            line-height: 1.6;
        }
        .path-chain .entity { color: #667eea; font-weight: 500; }
        .path-chain .ratio { color: #e67e22; }

        .empty-state { text-align: center; padding: 60px 20px; color: #bbb; }
        .loading { text-align: center; padding: 40px; color: #999; }
        .error-msg {
            background: #fff2f0; border: 1px solid #ffccc7; color: #cf1322;
            padding: 12px 16px; border-radius: 6px; margin-bottom: 16px; display: none;
        }
    </style>
</head>
<body>
    <div class="page-header">
        <h2>🏢 富勒股权穿透</h2>
    </div>

    <div class="error-msg" id="errorMsg"></div>

    <!-- 统计卡片 -->
    <div class="stats-row">
        <div class="stat-card">
            <div class="label">📊 股权路径总数</div>
            <div class="value" id="statPaths">-</div>
        </div>
        <div class="stat-card">
            <div class="label">👤 自然人股东数</div>
            <div class="value" id="statPersons">-</div>
        </div>
        <div class="stat-card">
            <div class="label">🏢 涉及公司数</div>
            <div class="value" id="statCompanies">-</div>
        </div>
        <div class="stat-card">
            <div class="label">🔍 当前模式</div>
            <div class="value" style="font-size:18px" id="statMode">全部数据</div>
        </div>
    </div>

    <!-- 搜索栏 -->
    <div class="search-bar">
        <div class="search-group">
            <label>💰 市值（亿元）</label>
            <input type="number" id="marketValue" value="18" step="0.01" min="0" style="min-width:120px;width:120px">
        </div>
        <button class="btn btn-primary" onclick="reload()">🔄 刷新计算</button>

        <div class="search-group">
            <label>👤 按人查询</label>
            <input type="text" id="searchPerson" placeholder="输入姓名（模糊搜索）">
        </div>
        <button class="btn btn-primary" onclick="searchByPerson()">🔍 查询</button>

        <div class="search-group">
            <label>🏢 按子公司查询</label>
            <select id="searchCompany">
                <option value="">-- 选择公司 --</option>
            </select>
        </div>
        <button class="btn btn-primary" onclick="searchByCompany()">🔍 查询</button>

        <button class="btn btn-outline" onclick="loadAll()">📋 查询全部</button>
    </div>

    <!-- 表格 -->
    <div class="table-container" id="tableContainer">
        <div class="loading">正在加载数据...</div>
    </div>

    <script>
        console.log('fulle-share v2.7.13'); // force cache bust
        let allCompanies = [];
        let currentData = [];
        let currentMode = 'all'; // 'all' | 'person' | 'company'
        let lastPersonName = '';
        let lastCompanyId = '';

        (async function init() {
            await loadCompanies();
            await loadAll();
        })();

        function getMarketValue() {
            const val = parseFloat(document.getElementById('marketValue').value);
            return (val && val > 0) ? val : 18;
        }

        async function loadCompanies() {
            try {
                const resp = await fetch('/api/fulle/companies');
                const json = await resp.json();
                if (json.success) {
                    allCompanies = json.data || [];
                    const sel = document.getElementById('searchCompany');
                    sel.innerHTML = '<option value="">-- 选择公司 --</option>';
                    allCompanies.forEach(c => {
                        const opt = document.createElement('option');
                        opt.value = c.id;
                        opt.textContent = c.companyName;
                        sel.appendChild(opt);
                    });
                }
            } catch (e) {
                showError('加载公司列表失败: ' + e.message);
            }
        }

        function reload() {
            if (currentMode === 'person') {
                searchByPerson();
            } else if (currentMode === 'company') {
                searchByCompany();
            } else {
                loadAll();
            }
        }

        async function loadAll() {
            currentMode = 'all';
            document.getElementById('statMode').textContent = '全部数据 市值: ' + getMarketValue() + '亿';
            document.getElementById('tableContainer').innerHTML = '<div class="loading">正在加载数据...</div>';
            try {
                const mv = getMarketValue();
                const resp = await fetch('/api/fulle/equity/all?marketValue=' + mv);
                const json = await resp.json();
                if (json.success) {
                    currentData = json.data || [];
                    updateStats();
                    renderTable(currentData);
                } else {
                    showError('加载失败');
                }
            } catch (e) {
                showError('请求失败: ' + e.message);
            }
        }

        async function searchByPerson() {
            const name = document.getElementById('searchPerson').value.trim();
            if (!name) { loadAll(); return; }

            currentMode = 'person';
            lastPersonName = name;
            document.getElementById('statMode').textContent = '按人查询: ' + name + ' 市值: ' + getMarketValue() + '亿';
            document.getElementById('tableContainer').innerHTML = '<div class="loading">正在查询...</div>';
            try {
                const mv = getMarketValue();
                const resp = await fetch('/api/fulle/equity/person?name=' + encodeURIComponent(name) + '&marketValue=' + mv);
                const json = await resp.json();
                if (json.success) {
                    currentData = json.data || [];
                    updateStats();
                    renderTable(currentData);
                } else {
                    showError('查询失败');
                }
            } catch (e) {
                showError('请求失败: ' + e.message);
            }
        }

        async function searchByCompany() {
            const companyId = document.getElementById('searchCompany').value;
            if (!companyId) { loadAll(); return; }

            currentMode = 'company';
            lastCompanyId = companyId;
            const sel = document.getElementById('searchCompany');
            const companyName = sel.options[sel.selectedIndex].textContent;
            document.getElementById('statMode').textContent = '按公司: ' + companyName + ' 市值: ' + getMarketValue() + '亿';
            document.getElementById('tableContainer').innerHTML = '<div class="loading">正在查询...</div>';
            try {
                const mv = getMarketValue();
                const resp = await fetch('/api/fulle/equity/company?companyId=' + companyId + '&marketValue=' + mv);
                const json = await resp.json();
                if (json.success) {
                    currentData = json.data || [];
                    updateStats();
                    renderTable(currentData);
                } else {
                    showError('查询失败');
                }
            } catch (e) {
                showError('请求失败: ' + e.message);
            }
        }

        function updateStats() {
            const totalPaths = currentData.length;
            const uniquePersons = new Set(currentData.map(d => d.holderName)).size;
            const uniquePlatforms = new Set(currentData.map(d => d.platformName)).size;

            document.getElementById('statPaths').textContent = totalPaths;
            document.getElementById('statPersons').textContent = uniquePersons;
            document.getElementById('statCompanies').textContent = uniquePlatforms;
        }

        function formatValue(val) {
            if (val == null) return '-';
            const num = parseFloat(val);
            if (isNaN(num)) return '-';
            if (num >= 1) return num.toFixed(4) + ' 亿';
            // 小于1亿，转成万元
            const wan = num * 10000;
            return wan.toFixed(2) + ' 万';
        }

        function renderTable(data) {
            if (!data || data.length === 0) {
                document.getElementById('tableContainer').innerHTML = '<div class="empty-state">📭 暂无数据</div>';
                return;
            }

            data.sort((a, b) => (b.topRatio || 0) - (a.topRatio || 0));

            const maxTopRatio = Math.max(...data.map(d => d.topRatio || 0), 1);
            const hasMarketValue = data.some(d => d.currentValue != null);

            let thExtra = hasMarketValue ? '<th>股权当前价值</th>' : '';

            let html = `<table>
                <thead>
                    <tr>
                        <th>自然人/股东</th>
                        <th>所属平台</th>
                        <th>直接持股(%)</th>
                        <th style="min-width:350px">股权路径链</th>
                        <th>路径折算(%)</th>
                        <th>最终占比(%)</th>
                        ${thExtra}
                    </tr>
                </thead>
                <tbody>`;

            data.forEach((row, idx) => {
                const barWidth = ((row.topRatio || 0) / maxTopRatio * 150).toFixed(0);
                const pathChainHtml = buildPathChainHtml(row.pathChain || '');
                const topRatioVal = row.topRatio ? row.topRatio.toFixed(4) : '0';
                const pathRatioVal = row.pathRatio ? row.pathRatio.toFixed(4) : '0';
                const directRatioVal = row.directRatio ? row.directRatio.toFixed(2) : '0';
                const valueHtml = hasMarketValue ? `<td style="color:#e67e22;font-weight:500">${formatValue(row.currentValue)}</td>` : '';

                html += `<tr>
                    <td><strong>${esc(row.holderName)}</strong></td>
                    <td>${esc(row.platformName || '')}</td>
                    <td>${directRatioVal}%</td>
                    <td class="path-chain">${pathChainHtml}</td>
                    <td>${pathRatioVal}%</td>
                    <td>
                        <span class="ratio-bar" style="width:${barWidth}px"></span>
                        <span class="highlight">${topRatioVal}%</span>
                    </td>
                    ${valueHtml}
                </tr>`;
            });

            html += '</tbody></table>';
            document.getElementById('tableContainer').innerHTML = html;
        }

        function buildPathChainHtml(chain) {
            if (!chain) return '';
            const parts = chain.split('→');
            let html = '';
            parts.forEach((part, i) => {
                if (i > 0) html += '<span style="color:#ccc;margin:0 2px">→</span>';
                const match = part.match(/^(.+?)\(([\d.]+)%\)$/);
                if (match) {
                    html += `<span class="entity">${esc(match[1])}</span>`;
                    html += `<span class="ratio">(${match[2]}%)</span>`;
                } else {
                    const innerMatch = part.match(/\(([\d.]+)%\)/);
                    if (innerMatch) {
                        const name = part.substring(0, part.indexOf('('));
                        html += `<span class="entity">${esc(name)}</span>`;
                        html += `<span class="ratio">(${innerMatch[1]}%)</span>`;
                    } else {
                        html += `<span class="entity">${esc(part)}</span>`;
                    }
                }
            });
            return html;
        }

        function esc(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function showError(msg) {
            const el = document.getElementById('errorMsg');
            el.textContent = msg;
            el.style.display = 'block';
            setTimeout(() => { el.style.display = 'none'; }, 5000);
        }

        document.getElementById('searchPerson').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') searchByPerson();
        });

        // 市值变化后自动刷新
        document.getElementById('marketValue').addEventListener('change', function() {
            reload();
        });
    </script>
</body>
</html>
